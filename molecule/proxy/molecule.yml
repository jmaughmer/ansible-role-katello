---
# Proxy scenario: installs a Katello server and a smart proxy on two existing
# VMs (RHEL 9 or AlmaLinux 9). The server needs 20 GB RAM, the proxy 12 GB;
# both need resolvable FQDNs. Molecule does not create or destroy them.
#
#   export KATELLO_TEST_HOST=katello.example.com
#   export KATELLO_TEST_PROXY_HOST=proxy.example.com
#   export KATELLO_TEST_USER=root
#   export KATELLO_TEST_ADMIN_PASSWORD='changeme123'
#   export KATELLO_TEST_METHOD=installer       # or foremanctl
#   export KATELLO_TEST_SSL_MODE=selfsigned    # or default
#   molecule test -s proxy
#
# Use throwaway VMs: the install cannot be undone.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml

driver:
  name: default
  options:
    managed: false
    login_cmd_template: "ssh {address} -l {user}"
    ansible_connection_options:
      ansible_connection: ssh

platforms:
  - name: katello-server
  - name: katello-proxy

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          katello-server:
            ansible_host: ${KATELLO_TEST_HOST}
            katello_hostname: ${KATELLO_TEST_HOST}
          katello-proxy:
            ansible_host: ${KATELLO_TEST_PROXY_HOST}
            katello_hostname: ${KATELLO_TEST_PROXY_HOST}
            katello_deployment: proxy
            katello_proxy_server: katello-server
            katello_proxy_server_fqdn: ${KATELLO_TEST_HOST}
    group_vars:
      all:
        ansible_user: ${KATELLO_TEST_USER:-root}
        ansible_become: true
        katello_install_method: ${KATELLO_TEST_METHOD:-installer}
        katello_ssl_mode: ${KATELLO_TEST_SSL_MODE:-selfsigned}
        katello_admin_username: admin
        katello_admin_password: ${KATELLO_TEST_ADMIN_PASSWORD}
        katello_initial_organization: Molecule Org
        katello_initial_location: Molecule Location

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - converge
    - idempotence
    - verify
