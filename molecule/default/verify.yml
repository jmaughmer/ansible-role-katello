    - name: Assert the role rejects two manifests for one organization
      ansible.builtin.assert:
        that:
          - not _katello_test_manifest_passed
          - _katello_test_expected in _katello_test_manifest_reason
        fail_msg: "Failed for another reason: {{ _katello_test_manifest_reason }}"
      vars:
        _katello_test_expected: "_katello_manifest_orgs | unique"

    - name: Run the role with a Red Hat repository set without repositories
      block:
        - name: Include the role's validation tasks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: assert.yml
          vars:
            katello_run_installer: false
            katello_redhat_repositories:
              - label: rhel-9-for-x86_64-baseos-rpms

        - name: Fail because validation passed
          ansible.builtin.set_fact:
            _katello_test_rhrepo_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_rhrepo_passed: false
            _katello_test_rhrepo_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert the role rejects a Red Hat repository set without repositories
      ansible.builtin.assert:
        that:
          - not _katello_test_rhrepo_passed
          - _katello_test_expected in _katello_test_rhrepo_reason
        fail_msg: "Failed for another reason: {{ _katello_test_rhrepo_reason }}"
      vars:
        _katello_test_expected: "item.all_repositories | default(false) | bool"

    - name: Accept complete manifests and Red Hat repositories
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: assert.yml
      vars:
        katello_run_installer: false
        katello_subscription_manifests:
          - file: files/manifest.zip
            repository_url: https://cdn.redhat.com
          - organization: Lab
            file: /root/manifest_lab.zip
            remote_src: true
          - organization: Old
            state: absent
        katello_redhat_repositories:
          - label: rhel-9-for-x86_64-baseos-rpms
            repositories:
              - releasever: "9"
          - name: Red Hat Enterprise Linux 9 for x86_64 - AppStream (RPMs)
            product: Red Hat Enterprise Linux for x86_64
            repositories:
              - releasever: "9"
                basearch: x86_64
            sync: true
          - label: satellite-client-6-for-rhel-9-x86_64-rpms
            all_repositories: true
            state: disabled

- name: Verify the pre-flight checks and the tuning profile selection
  hosts: katello-server
  gather_facts: true
  tasks:
    - name: Run the pre-flight checks for a host that is too small
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: preflight.yml
      vars:
        katello_preflight_enforce: false
        _katello_host_memory_mb: 1024
        _katello_host_swap_mb: 0
        _katello_host_cpus: 1

    - name: Assert the memory, swap and CPU checks failed
      ansible.builtin.assert:
        that:
          - "'MB RAM is required (found 1024 MB)' in _katello_test_preflight"
          - "'MB swap is required (found 0 MB)' in _katello_test_preflight"
          - "'CPU cores are required (found 1)' in _katello_test_preflight"
        fail_msg: "{{ _katello_preflight_failures }}"
      vars:
        _katello_test_preflight: "{{ _katello_preflight_failures | join(' ') }}"

    - name: Run the pre-flight checks for a host that is large enough
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: preflight.yml
      vars:
        katello_preflight_enforce: false
        _katello_host_memory_mb: 1048576
        _katello_host_swap_mb: 65536
        _katello_host_cpus: 64

    - name: Assert the memory, swap and CPU checks passed
      ansible.builtin.assert:
        that:
          - "'MB RAM is required' not in _katello_test_preflight"
          - "'MB swap is required' not in _katello_test_preflight"
          - "'CPU cores are required' not in _katello_test_preflight"
        fail_msg: "{{ _katello_preflight_failures }}"
      vars:
        _katello_test_preflight: "{{ _katello_preflight_failures | join(' ') }}"

    - name: Enforce the pre-flight checks for a host that is too small
      block:
        - name: Include the pre-flight checks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: preflight.yml
          vars:
            katello_preflight_enforce: true
            _katello_host_memory_mb: 1024

        - name: Fail because the checks passed
          ansible.builtin.set_fact:
            _katello_test_preflight_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_preflight_passed: false
            _katello_test_preflight_reason: "{{ ansible_failed_result.msg | join(' ') }}"

    - name: Assert enforced pre-flight checks stop the run
      ansible.builtin.assert:
        that:
          - not _katello_test_preflight_passed
          - "'MB RAM is required (found 1024 MB)' in _katello_test_preflight_reason"

    - name: Check the tuning profile picked for each host count and hardware size
      ansible.builtin.include_tasks: tasks/check_tuning.yml
      loop:
        - {name: 4000 hosts, hosts: 4000, expected: default}
        - {name: 7000 hosts, hosts: 7000, expected: medium}
        - {name: 15000 hosts, hosts: 15000, expected: large}
        - {name: 50000 hosts, hosts: 50000, expected: extra-large}
        - {name: 100000 hosts, hosts: 100000, expected: extra-extra-large}
        - {name: 8 cores and 40 GB, hosts: 0, cpus: 8, memory_mb: 40000, expected: medium}
        - {name: 16 cores and 40 GB, hosts: 0, cpus: 16, memory_mb: 40000, expected: medium}
        - {name: 64 cores and 300 GB, hosts: 0, cpus: 64, memory_mb: 300000, expected: extra-extra-large}
        - {name: a host below every profile, hosts: 0, cpus: 2, memory_mb: 8000, expected: default}
      loop_control:
        loop_var: _katello_test_case
        label: "{{ _katello_test_case.name }}"

- name: Verify the foreman-installer command for the server
  hosts: katello-server
  gather_facts: true
  tasks:
    - name: Select the tuning profile
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: tuning.yml

    - name: Build the install command
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml

    - name: Assert the command matches the host settings
      ansible.builtin.assert:
        that:
          - _katello_install_args[:3] == ['foreman-installer', '--scenario', 'katello']
          - "'--certs-server-cert /root/foreman_cert/foreman_cert.pem' in _katello_test_command"
          - "'--certs-server-key /root/foreman_cert/foreman_cert_key.pem' in _katello_test_command"
          - "'--certs-server-ca-cert /root/foreman_cert/ca_cert_bundle.pem' in _katello_test_command"
          - "'--enable-foreman-plugin-remote-execution' in _katello_install_args"
          - "'--enable-foreman-plugin-ansible' in _katello_install_args"
          - "'--tuning medium' in _katello_test_command"
          - "'--foreman-foreman-service-puma-threads-max 16' in _katello_test_command"
          - "'--foreman-dynflow-worker-instances 3' in _katello_test_command"
          - "'initial' not in _katello_test_command"
          - _katello_install_initial_args == _katello_test_initial_args
          - _katello_install_secret_args | length == 2
          - _katello_install_secret_args[0] == '--foreman-initial-admin-password'
          - _katello_install_runtime_args == []
          - _katello_install_needed | bool
        fail_msg: "{{ _katello_install_args }}"
      vars:
        _katello_test_command: "{{ _katello_install_args | join(' ') }}"
        _katello_test_initial_args:
          - --foreman-initial-organization
          - Default Organization
          - --foreman-initial-location
          - Default Location
          - --foreman-initial-admin-username
          - admin

    - name: Record the fingerprint
      ansible.builtin.set_fact:
        _katello_test_fingerprint: "{{ _katello_install_fingerprint }}"

    - name: Build the command with other initial settings and admin password
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_admin_username: root
        katello_admin_password: another-password
        katello_initial_organization: Another Organization
        katello_initial_location: Another Location

    - name: Assert the initial settings do not change the fingerprint
      ansible.builtin.assert:
        that:
          - "'Another Organization' in _katello_install_initial_args"
          - _katello_install_fingerprint == _katello_test_fingerprint

    - name: Build the command with fewer plugins
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_foreman_plugins: [remote_execution]

    - name: Assert a plugin change changes the fingerprint
      ansible.builtin.assert:
        that:
          - "'--enable-foreman-plugin-ansible' not in _katello_install_args"
          - _katello_install_fingerprint != _katello_test_fingerprint

    - name: Select no tuning profile
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: tuning.yml
      vars:
        katello_tuning: ""

    - name: Build the command without a tuning profile
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_tuning: ""

    - name: Assert the default profile is passed explicitly
      ansible.builtin.assert:
        that:
          - "'--tuning default' in (_katello_install_args | join(' '))"

- name: Verify the foreman-installer command for the smart proxy
  hosts: katello-proxy
  gather_facts: true
  tasks:
    - name: Build the install command
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        # Read from the server's installer answers during a real install.
        _katello_proxy_oauth_key: test-key
        _katello_proxy_oauth_secret: test-secret

    - name: Assert the command matches the proxy settings
      ansible.builtin.assert:
        that:
          - _katello_install_args[:3] == ['foreman-installer', '--scenario', 'foreman-proxy-content']
          - "'--certs-tar-file /var/lib/ansible-katello/proxy.example.test-certs.tar' in _katello_test_command"
          - "'--foreman-proxy-foreman-base-url https://katello-server' in _katello_test_command"
          - "'--foreman-proxy-trusted-hosts proxy.example.test' in _katello_test_command"
          - "'--enable-foreman-proxy-plugin-remote-execution-script' in _katello_install_args"
          - "'--tuning' not in _katello_install_args"
          - _katello_install_initial_args == []
          - _katello_install_secret_args == _katello_test_secret_args
        fail_msg: "{{ _katello_install_args }}"
      vars:
        _katello_test_command: "{{ _katello_install_args | join(' ') }}"
        _katello_test_secret_args:
          - --foreman-proxy-oauth-consumer-key
          - test-key
          - --foreman-proxy-oauth-consumer-secret
          - test-secret
