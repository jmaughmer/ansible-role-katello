---
# Tests run on the Proxmox test lab: two real KVM VMs cloned from the lab
# fleet onto the isolated labnet network (EL9, SELinux enforcing, firewalld
# running), the only setup that can carry a real Katello install:
#   katello-default-server  the Katello server (20 GB RAM, 4 cores, a 4 GB
#                           swap file from prepare.yml) — foreman-installer
#                           runs for real, with the full fixture set below
#   katello-default-proxy   a smart proxy (12 GB RAM, 4 cores) registered to
#                           the server over its content-delivery certificate
# The pre-flight checks are enforced: prepare.yml names each VM after its
# FQDN and seeds /etc/hosts with both names and addresses, which is what
# getent-based forward and reverse DNS resolution needs on the lab network
# (its DHCP names are not registered). Every address the playbooks need
# comes from gathered facts. All Proxmox connection details live in the
# driver's secrets file on the control machine, not here.
#
# The install itself is slow — expect 1 to 2 hours for a full test run
# (installer converge plus the idempotence converge).
#
# Default VMIDs are the repo's 9311-9312 band, via LAB_VMID_0/1 so the lab's
# `mlab` runner can claim a free band per run and allow parallel runs of this
# repo; a plain molecule test uses the pinned band, one lab run at a time.
# Needs the memory/cores passthrough patch in the molecule-proxmox driver
# (ct-bootstrap.sh re-applies it after pipx upgrades).
#
# Run on the lab's molecule control machine:
#   /root/labnet/mlab test -s default              # parallel-safe, recommended
#   molecule test                                  # pinned band
#
# The Katello 5.0 installer ships for EL9 only; on EL10 the role installs
# with foremanctl, which this scenario does not run (see README "Testing").
role_name_check: 1

dependency:
  name: galaxy
  enabled: false        # collections preinstalled on the control machine
prerun: false

driver:
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: 300

platforms:
  - name: katello-default-server
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_0:-9311}
    groups: [katello_server]
    memory: 20480
    cores: 4

  - name: katello-default-proxy
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_1:-9312}
    groups: [katello_proxy]
    memory: 12288
    cores: 4

provisioner:
  name: ansible
  env:
    # The role under test resolves through the sibling role checkouts.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:/root/.ansible/roles"
  inventory:
    group_vars:
      all:
        # The driver's SSH lands as a sudo user (unlike a container's root);
        # make every task of the playbooks become-root.
        ansible_become: true
        # Test-only credentials, like the other scenarios' inventory.
        katello_admin_username: admin
        katello_admin_password: molecule-admin-password-2026
        katello_initial_organization: Molecule Org
        katello_initial_location: Molecule Location
        # Show the installer command output in the molecule log. The role
        # hides it (it carries the admin password) to protect production
        # runs; here every credential involved is already committed below,
        # and a failed converge is only debuggable from the run log when the
        # installer's own errors are visible in it.
        katello_no_log: false
      katello_server:
        # The FQDN the installer installs under and every check resolves.
        # prepare.yml seeds /etc/hosts so forward and reverse resolution and
        # the system FQDN all agree, which the pre-flight checks enforce.
        katello_hostname: katello.example.test
        katello_ssl_mode: selfsigned
      katello_proxy:
        katello_hostname: proxy.example.test
        katello_deployment: proxy
        katello_proxy_server: katello-default-server
        katello_proxy_server_fqdn: katello.example.test
        # Must match the server: the proxy-side bundle tasks that sign the
        # proxy certificate with the server's role-generated CA and hand it
        # to foreman-proxy-certs-generate are gated on this mode. Left at
        # the default the bundle tool silently mints a fresh CA the server's
        # certificate is not signed by, and the proxy then cannot verify the
        # server's API TLS during registration.
        katello_ssl_mode: selfsigned

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
