---
- name: Verify both hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Assert foremanctl is installed and the RPM installer is not
      ansible.builtin.assert:
        that:
          - "'foreman-release' in ansible_facts.packages"
          - "'katello-repos' in ansible_facts.packages"
          - "'foremanctl' in ansible_facts.packages"
          - "'foreman-installer-katello' not in ansible_facts.packages"
          - "'foreman-proxy-content' not in ansible_facts.packages"
          # OpenVox (Puppet) is only needed by foreman-installer.
          - "'openvox8-release' not in ansible_facts.packages"

    - name: Assert the repositories match the host's EL version
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['foreman-release'][0].release is search('\.el' ~ ansible_facts['distribution_major_version'] ~ '$')
          - ansible_facts.packages['katello-repos'][0].release is search('\.el' ~ ansible_facts['distribution_major_version'] ~ '$')
          - ansible_facts.packages['foreman-release'][0].version is version('5.0', '>=')
          - ansible_facts.packages['foreman-release'][0].version is version('5.1', '<')

    - name: Check that the Foreman signing key was imported
      ansible.builtin.command:
        argv: [rpm, -q, gpg-pubkey-ff7d88bf]
      changed_when: false

    - name: List enabled repositories
      ansible.builtin.command:
        argv: [dnf, repolist, --enabled]
      register: _katello_test_repolist
      changed_when: false

    - name: Assert the Foreman and Katello repositories are enabled
      ansible.builtin.assert:
        that:
          - _katello_test_repolist.stdout is search('(?im)^foreman\s')
          - _katello_test_repolist.stdout is search('(?im)^katello\s')

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert chronyd is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chronyd.service'].state == 'running'

    - name: Read the katello tuned profile
      ansible.builtin.slurp:
        src: /etc/tuned/katello/tuned.conf
      register: _katello_test_tuned

    - name: Assert the profile disables THP
      ansible.builtin.assert:
        that:
          - "'transparent_hugepages=never' in (_katello_test_tuned.content | b64decode)"

    - name: Check that no foreman-installer Hiera file was written
      ansible.builtin.stat:
        path: /etc/foreman-installer/custom-hiera.yaml
      register: _katello_test_hiera

    - name: Check that no install was attempted
      ansible.builtin.stat:
        path: /var/lib/ansible-katello/install.sha256
      register: _katello_test_state

    - name: Assert custom-hiera.yaml is absent and foremanctl did not run
      ansible.builtin.assert:
        that:
          - not _katello_test_hiera.stat.exists
          - not _katello_test_state.stat.exists

- name: Verify the self-signed certificate on the server
  hosts: katello-server
  gather_facts: false
  tasks:
    - name: Read the server certificate
      community.crypto.x509_certificate_info:
        path: /root/foreman_cert/foreman_cert.pem
      register: _katello_test_cert

    - name: Assert the certificate names the server
      ansible.builtin.assert:
        that:
          - _katello_test_cert.subject.commonName == 'katello.example.test'
          - "'DNS:katello.example.test' in _katello_test_cert.subject_alt_name"
          - not _katello_test_cert.expired

    - name: Verify the chain with openssl
      ansible.builtin.command:
        argv: [openssl, verify, -CAfile, /root/foreman_cert/ca_cert_bundle.pem, /root/foreman_cert/foreman_cert.pem]
      changed_when: false

- name: Verify the smart proxy host
  hosts: katello-proxy
  gather_facts: false
  tasks:
    - name: Check that no server certificate was generated on the proxy
      ansible.builtin.stat:
        path: /root/foreman_cert
      register: _katello_test_proxy_ssl_dir

    - name: Assert the proxy has no server certificate directory
      ansible.builtin.assert:
        that:
          - not _katello_test_proxy_ssl_dir.stat.exists

- name: Verify input validation on EL10
  hosts: katello-server
  gather_facts: true
  vars:
    # The failed assertions of the task that sent a block to "rescue", so a
    # negative test only passes if it failed for the expected reason.
    _katello_test_failed_assertions: >-
      {{ ([ansible_failed_result] + ansible_failed_result.results | default([]))
         | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='assertion', default='') | join(' | ') }}
  tasks:
    - name: Run the role with custom Hiera settings
      block:
        - name: Include the role's validation tasks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: assert.yml
          vars:
            katello_custom_hiera:
              apache::mod::proxy::proxy_timeout: 600

        - name: Fail because validation passed
          ansible.builtin.set_fact:
            _katello_test_hiera_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_hiera_passed: false
            _katello_test_hiera_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert custom Hiera settings are rejected with foremanctl
      ansible.builtin.assert:
        that:
          - not _katello_test_hiera_passed
          - _katello_test_expected in _katello_test_hiera_reason
        fail_msg: "Failed for another reason: {{ _katello_test_hiera_reason }}"
      vars:
        _katello_test_expected: "katello_install_method == 'installer' or katello_custom_hiera"

    - name: Run the role with the RPM installer
      block:
        - name: Include the role's validation tasks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: assert.yml
          vars:
            katello_install_method: installer

        - name: Fail because validation passed
          ansible.builtin.set_fact:
            _katello_test_installer_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_installer_passed: false
            _katello_test_installer_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert the RPM installer is rejected on EL10
      ansible.builtin.assert:
        that:
          - not _katello_test_installer_passed
          - _katello_test_expected in _katello_test_installer_reason
        fail_msg: "Failed for another reason: {{ _katello_test_installer_reason }}"
      vars:
        _katello_test_expected: "katello_install_method in _katello_methods_by_el[_katello_el]"

    - name: Run the role with installer plugin lists
      block:
        - name: Include the role's validation tasks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: assert.yml
          vars:
            katello_foreman_plugins: [remote_execution]

        - name: Fail because validation passed
          ansible.builtin.set_fact:
            _katello_test_plugin_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_plugin_passed: false
            _katello_test_plugin_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert installer plugin lists are rejected with foremanctl
      ansible.builtin.assert:
        that:
          - not _katello_test_plugin_passed
          - _katello_test_expected in _katello_test_plugin_reason
        fail_msg: "Failed for another reason: {{ _katello_test_plugin_reason }}"
      vars:
        _katello_test_expected: "katello_install_method == 'installer' or (katello_foreman_plugins"

    - name: Run the role with a feature name that is not a name
      block:
        - name: Include the role's validation tasks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: assert.yml
          vars:
            katello_foremanctl_features: [Remote Execution]

        - name: Fail because validation passed
          ansible.builtin.set_fact:
            _katello_test_feature_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_feature_passed: false
            _katello_test_feature_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert an invalid feature name is rejected
      ansible.builtin.assert:
        that:
          - not _katello_test_feature_passed
          - _katello_test_expected in _katello_test_feature_reason
        fail_msg: "Failed for another reason: {{ _katello_test_feature_reason }}"
      vars:
        _katello_test_expected: "katello_foremanctl_features | reject('match'"

- name: Verify the foremanctl command for the server
  hosts: katello-server
  gather_facts: true
  vars:
    _katello_test_params_file: /var/lib/foremanctl/parameters.yaml
  tasks:
    - name: Select the tuning profile
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: tuning.yml

    - name: Build the install command
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml

    - name: Assert the command matches the host settings
      ansible.builtin.assert:
        that:
          - _katello_install_args[:2] == ['foremanctl', 'deploy']
          - "'--certificate-source custom_server' in _katello_test_command"
          - "'--certificate-server-certificate /root/foreman_cert/foreman_cert.pem' in _katello_test_command"
          - "'--certificate-server-key /root/foreman_cert/foreman_cert_key.pem' in _katello_test_command"
          - "'--certificate-server-ca-certificate /root/foreman_cert/ca_cert_bundle.pem' in _katello_test_command"
          - "'--add-feature=remote-execution' in _katello_install_args"
          - "'--server-alias=katello-alias.example.test' in _katello_install_args"
          - "'--tuning medium' in _katello_test_command"
          # foremanctl has no options for these, and 0 workers keeps its own count.
          - "'puma' not in _katello_test_command"
          - "'dynflow' not in _katello_test_command"
          - "'initial' not in _katello_test_command"
          - _katello_install_initial_args == _katello_test_initial_args
          - _katello_install_secret_args | length == 2
          - _katello_install_secret_args[0] == '--initial-admin-password'
          - _katello_install_runtime_args == []
          - _katello_foremanctl_stale_aliases == []
        fail_msg: "{{ _katello_install_args }}"
      vars:
        _katello_test_command: "{{ _katello_install_args | join(' ') }}"
        _katello_test_initial_args:
          - --initial-organization
          - Default Organization
          - --initial-location
          - Default Location
          - --initial-admin-username
          - admin

    - name: Record the fingerprint
      ansible.builtin.set_fact:
        _katello_test_fingerprint: "{{ _katello_install_fingerprint }}"

    - name: Build the command with feature names that use underscores
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_foremanctl_features: [remote_execution, remote-execution, content/ostree]

    - name: Assert the feature names are normalized and listed once
      ansible.builtin.assert:
        that:
          - _katello_test_features == ['--add-feature=remote-execution', '--add-feature=content/ostree']
        fail_msg: "{{ _katello_test_features }}"
      vars:
        _katello_test_features: "{{ _katello_install_args | select('match', '^--add-feature=') | list }}"

    - name: Build the command with a Puma worker count
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_tuning_puma_workers: 6

    - name: Assert the Puma workers are passed and change the fingerprint
      ansible.builtin.assert:
        that:
          - "'--foreman-puma-workers 6' in _katello_install_args | join(' ')"
          - _katello_install_runtime_args == []
          - _katello_install_fingerprint != _katello_test_fingerprint
        fail_msg: "{{ _katello_install_args }}"

    - name: Create the foremanctl state directory
      ansible.builtin.file:
        path: "{{ _katello_test_params_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0770"

    # What foremanctl keeps after a deploy with one more feature and alias,
    # and a Puma worker count.
    - name: Write the parameters of an earlier foremanctl run
      ansible.builtin.copy:
        dest: "{{ _katello_test_params_file }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          certificates_source: custom_server
          features:
          - remote-execution
          - ansible
          foreman_initial_admin_password: not-a-real-password
          foreman_puma_workers: 6
          server_aliases:
          - katello-alias.example.test
          - old-alias.example.test
          tuning: medium

    - name: Build the command after that run
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml

    - name: Assert the feature, alias and Puma workers that are no longer set are removed
      ansible.builtin.assert:
        that:
          - _katello_install_runtime_args == ['--remove-feature=ansible', '--reset-foreman-puma-workers']
          - _katello_foremanctl_kept_aliases == ['katello-alias.example.test']
          - _katello_foremanctl_stale_aliases == ['old-alias.example.test']
          # Removing them only applies to this run, so it is not fingerprinted.
          - _katello_install_fingerprint == _katello_test_fingerprint
        fail_msg: "{{ _katello_install_runtime_args }}"

    - name: Build the command with the Puma worker count foremanctl kept
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_tuning_puma_workers: 6

    - name: Assert the Puma workers are not reset while they are set
      ansible.builtin.assert:
        that:
          - _katello_install_runtime_args == ['--remove-feature=ansible']
        fail_msg: "{{ _katello_install_runtime_args }}"

    - name: Build the command with other initial settings and admin password
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_admin_username: root
        katello_admin_password: another-password
        katello_initial_organization: Another Organization
        katello_initial_location: Another Location

    - name: Assert the initial settings do not change the fingerprint
      ansible.builtin.assert:
        that:
          - "'Another Organization' in _katello_install_initial_args"
          - _katello_install_fingerprint == _katello_test_fingerprint

    - name: Build the command without features or aliases
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml
      vars:
        katello_foremanctl_features: []
        katello_foremanctl_server_aliases: []

    - name: Assert every kept feature and alias is removed and the fingerprint changes
      ansible.builtin.assert:
        that:
          - _katello_install_runtime_args == ['--remove-feature=remote-execution', '--remove-feature=ansible', '--reset-foreman-puma-workers']
          - _katello_foremanctl_kept_aliases == []
          - _katello_foremanctl_stale_aliases | length == 2
          - _katello_install_fingerprint != _katello_test_fingerprint
        fail_msg: "{{ _katello_install_runtime_args }}"

- name: Verify the foremanctl command and checks for the smart proxy
  hosts: katello-proxy
  gather_facts: true
  vars:
    _katello_test_failed_assertions: >-
      {{ ([ansible_failed_result] + ansible_failed_result.results | default([]))
         | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='assertion', default='') | join(' | ') }}
  tasks:
    - name: Build the install command
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: install_args.yml

    - name: Assert the command matches the proxy settings
      ansible.builtin.assert:
        that:
          - _katello_install_args == _katello_test_command
          - _katello_install_initial_args == []
          - _katello_install_secret_args == []
          - _katello_install_runtime_args == []
        fail_msg: "{{ _katello_install_args }}"
      vars:
        _katello_test_command:
          - foremanctl
          - deploy-proxy
          - --flavor
          - foreman-proxy-content
          - --auth-bundle
          - /var/lib/ansible-katello/proxy.example.test.tar.gz
          - --foreman-fqdn
          - katello-server

    # The server's parameters (written above) say it uses its own certificate.
    - name: Accept a proxy with its own certificate
      ansible.builtin.include_role:
        name: ansible-role-katello
        tasks_from: proxy_checks.yml
      vars:
        katello_ssl_mode: selfsigned

    - name: Run the checks for a proxy with foremanctl's certificate
      block:
        - name: Include the proxy checks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: proxy_checks.yml
          vars:
            katello_ssl_mode: default

        - name: Fail because the checks passed
          ansible.builtin.set_fact:
            _katello_test_proxy_ssl_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_proxy_ssl_passed: false
            _katello_test_proxy_ssl_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert a proxy certificate mode that differs from the server's is rejected
      ansible.builtin.assert:
        that:
          - not _katello_test_proxy_ssl_passed
          - _katello_test_expected in _katello_test_proxy_ssl_reason
        fail_msg: "Failed for another reason: {{ _katello_test_proxy_ssl_reason }}"
      vars:
        _katello_test_expected: "(katello_ssl_mode == 'default') == (_katello_server_cert_source == 'default')"

    - name: Run the checks for a proxy on another EL version
      block:
        - name: Include the proxy checks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: proxy_checks.yml
          vars:
            _katello_el: "9"

        - name: Fail because the checks passed
          ansible.builtin.set_fact:
            _katello_test_proxy_el_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_proxy_el_passed: false
            _katello_test_proxy_el_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert a proxy on another EL version than its server is rejected
      ansible.builtin.assert:
        that:
          - not _katello_test_proxy_el_passed
          - _katello_test_expected in _katello_test_proxy_el_reason
        fail_msg: "Failed for another reason: {{ _katello_test_proxy_el_reason }}"
      vars:
        _katello_test_expected: "['distribution_major_version'] == _katello_el"

    - name: Remove the server's foremanctl parameters
      ansible.builtin.file:
        path: /var/lib/foremanctl/parameters.yaml
        state: absent
      delegate_to: katello-server

    - name: Run the checks against a server that was not deployed
      block:
        - name: Include the proxy checks
          ansible.builtin.include_role:
            name: ansible-role-katello
            tasks_from: proxy_checks.yml
          vars:
            katello_ssl_mode: selfsigned

        - name: Fail because the checks passed
          ansible.builtin.set_fact:
            _katello_test_proxy_deployed_passed: true
      rescue:
        - name: Record the expected failure
          ansible.builtin.set_fact:
            _katello_test_proxy_deployed_passed: false
            _katello_test_proxy_deployed_reason: "{{ _katello_test_failed_assertions }}"

    - name: Assert a proxy for a server that was not deployed is rejected
      ansible.builtin.assert:
        that:
          - not _katello_test_proxy_deployed_passed
          - _katello_test_expected in _katello_test_proxy_deployed_reason
        fail_msg: "Failed for another reason: {{ _katello_test_proxy_deployed_reason }}"
      vars:
        _katello_test_expected: "_katello_proxy_server_params.content is defined"
