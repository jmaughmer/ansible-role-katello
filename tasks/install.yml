---
# The admin password is kept out of _katello_install_args so it is not part
# of the fingerprint. The --initial-admin-* options only affect a new
# database, so changing them later should not re-run the installer.
- name: Build the plugin and certificate arguments
  ansible.builtin.set_fact:
    _katello_plugin_args: >-
      {{ (katello_foreman_plugins | map('replace', '_', '-') | map('regex_replace', '^', '--enable-foreman-plugin-') | list)
         + (katello_foreman_proxy_plugins | map('replace', '_', '-') | map('regex_replace', '^', '--enable-foreman-proxy-plugin-') | list)
         + (katello_foreman_cli_plugins | map('replace', '_', '-') | map('regex_replace', '^', '--enable-foreman-cli-') | list) }}
    _katello_ssl_installer_args: >-
      {{ [] if katello_ssl_mode == 'default' else
         ['--certs-server-cert', _katello_ssl_files.cert,
          '--certs-server-key', _katello_ssl_files.key,
          '--certs-server-ca-cert', _katello_ssl_files.ca] }}
    _katello_ssl_foremanctl_args: >-
      {{ ['--certificate-source', 'default'] if katello_ssl_mode == 'default' else
         ['--certificate-source', 'custom_server',
          '--certificate-server-certificate', _katello_ssl_files.cert,
          '--certificate-server-key', _katello_ssl_files.key,
          '--certificate-server-ca-certificate', _katello_ssl_files.ca] }}

    _katello_tuning_installer_args: >-
      {{ (['--foreman-foreman-service-puma-threads-max', katello_tuning_puma_threads | string]
          if katello_tuning_puma_threads | int > 0 else [])
         + (['--foreman-foreman-service-puma-workers', katello_tuning_puma_workers | string]
            if katello_tuning_puma_workers | int > 0 else [])
         + (['--foreman-dynflow-worker-instances', katello_tuning_dynflow_workers | string]
            if katello_tuning_dynflow_workers | int > 0 else []) }}

- name: Build the foreman-installer arguments for a server
  ansible.builtin.set_fact:
    _katello_install_args: >-
      {{ ['foreman-installer', '--scenario', 'katello',
          '--foreman-initial-organization', katello_initial_organization,
          '--foreman-initial-location', katello_initial_location,
          '--foreman-initial-admin-username', katello_admin_username]
         + _katello_ssl_installer_args
         + _katello_plugin_args
         + (['--tuning', _katello_tuning_profile] if _katello_tuning_profile | default('', true) | length > 0 else [])
         + _katello_tuning_installer_args
         + katello_installer_extra_args }}
    _katello_install_secret_args:
      - --foreman-initial-admin-password
      - "{{ katello_admin_password }}"
  when:
    - katello_deployment == 'server'
    - katello_install_method == 'installer'

- name: Build the foremanctl arguments for a server
  ansible.builtin.set_fact:
    _katello_install_args: >-
      {{ ['foremanctl', 'deploy',
          '--initial-organization', katello_initial_organization,
          '--initial-location', katello_initial_location,
          '--initial-admin-username', katello_admin_username]
         + _katello_ssl_foremanctl_args
         + (katello_foremanctl_features | map('regex_replace', '^', '--add-feature=') | list)
         + (katello_foremanctl_server_aliases | map('regex_replace', '^', '--server-alias=') | list)
         + (['--tuning', _katello_tuning_profile] if _katello_tuning_profile | default('', true) | length > 0 else [])
         + katello_foremanctl_extra_args }}
    _katello_install_secret_args:
      - --initial-admin-password
      - "{{ katello_admin_password }}"
  when:
    - katello_deployment == 'server'
    - katello_install_method == 'foremanctl'

- name: Build the foreman-installer arguments for a smart proxy
  ansible.builtin.set_fact:
    _katello_install_args: >-
      {{ ['foreman-installer', '--scenario', 'foreman-proxy-content',
          '--certs-tar-file', _katello_proxy_bundle_path,
          '--foreman-proxy-foreman-base-url', 'https://' ~ katello_proxy_server_fqdn,
          '--foreman-proxy-trusted-hosts', katello_proxy_server_fqdn,
          '--foreman-proxy-trusted-hosts', _katello_proxy_fqdn]
         + (katello_foreman_proxy_plugins | map('replace', '_', '-') | map('regex_replace', '^', '--enable-foreman-proxy-plugin-') | list)
         + katello_installer_extra_args }}
    _katello_install_secret_args:
      - --foreman-proxy-oauth-consumer-key
      - "{{ _katello_proxy_oauth_key }}"
      - --foreman-proxy-oauth-consumer-secret
      - "{{ _katello_proxy_oauth_secret }}"
  when:
    - katello_deployment == 'proxy'
    - katello_install_method == 'installer'

- name: Build the foremanctl arguments for a smart proxy
  ansible.builtin.set_fact:
    _katello_install_args: >-
      {{ ['foremanctl', 'deploy-proxy',
          '--flavor', 'foreman-proxy-content',
          '--auth-bundle', _katello_proxy_bundle_path,
          '--foreman-fqdn', katello_proxy_server_fqdn]
         + (katello_foremanctl_features | map('regex_replace', '^', '--add-feature=') | list)
         + katello_foremanctl_extra_args }}
    _katello_install_secret_args: []
  when:
    - katello_deployment == 'proxy'
    - katello_install_method == 'foremanctl'

# Certificate, bundle and custom-hiera.yaml checksums are part of the
# fingerprint, so changing them re-runs the installer.
- name: Compute the install fingerprint
  ansible.builtin.set_fact:
    _katello_install_fingerprint: >-
      {{ ([katello_version, katello_foreman_version, katello_deployment]
          + _katello_install_args
          + (_katello_ssl_checksums | default([]))
          + [_katello_custom_hiera_checksum | default('')]
          + [_katello_proxy_bundle_checksum | default('')]) | to_json | hash('sha256') }}

- name: Create the state directory
  ansible.builtin.file:
    path: "{{ _katello_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Read the fingerprint of the last install
  ansible.builtin.slurp:
    src: "{{ _katello_state_file }}"
  register: _katello_last_install
  failed_when: false

# Replacing the certificate of an installed server needs the update flags.
# They are not part of the fingerprint, which would change after the first run.
- name: Add the certificate update flags for an installed server
  ansible.builtin.set_fact:
    _katello_install_runtime_args: >-
      {{ ['--certs-update-server', '--certs-update-server-ca']
         if (katello_deployment == 'server' and katello_install_method == 'installer'
             and katello_ssl_mode != 'default' and _katello_last_install.content is defined)
         else [] }}

- name: Run {{ katello_install_method }}
  ansible.builtin.command:
    argv: "{{ _katello_install_args + _katello_install_secret_args + _katello_install_runtime_args }}"
  environment:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
  async: "{{ katello_install_timeout }}"
  poll: 30
  no_log: "{{ katello_no_log | bool }}"
  changed_when: true
  when: >-
    katello_force_install | bool
    or (_katello_last_install.content | default('') | b64decode | trim) != _katello_install_fingerprint

- name: Record the install fingerprint
  ansible.builtin.copy:
    content: "{{ _katello_install_fingerprint }}\n"
    dest: "{{ _katello_state_file }}"
    owner: root
    group: root
    mode: "0600"
