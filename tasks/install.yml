---
- name: Build the install command
  ansible.builtin.import_tasks: install_args.yml

- name: Create the state directory
  ansible.builtin.file:
    path: "{{ _katello_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# foremanctl cannot drop a single server alias, so stale ones are removed
# from the parameters it kept before it runs.
- name: Remove server aliases that are no longer listed from the foremanctl parameters
  ansible.builtin.copy:
    content: >-
      {{ (_katello_foremanctl_params.content | b64decode | from_yaml)
         | combine({'server_aliases': _katello_foremanctl_kept_aliases}) | to_nice_yaml }}
    dest: "{{ _katello_foremanctl_params_file }}"
    mode: preserve
  no_log: true
  when:
    - katello_install_method == 'foremanctl'
    - _katello_install_needed | bool
    - _katello_foremanctl_stale_aliases | length > 0

- name: Run {{ katello_install_method }}
  ansible.builtin.command:
    argv: "{{ _katello_install_args + _katello_install_initial_args + _katello_install_secret_args + _katello_install_runtime_args }}"
  environment:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
  async: "{{ katello_install_timeout }}"
  poll: 30
  no_log: "{{ katello_no_log | bool }}"
  changed_when: true
  when: _katello_install_needed | bool

- name: Record the install fingerprint
  ansible.builtin.copy:
    content: "{{ _katello_install_fingerprint }}
"
    dest: "{{ _katello_state_file }}"
    owner: root
    group: root
    mode: "0600"
