---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Open firewall services
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ _katello_firewall[katello_install_method]['services'] + katello_firewall_extra_services }}"

- name: Open firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ _katello_firewall[katello_install_method]['ports'] + katello_firewall_extra_ports }}"
